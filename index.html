<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NME · New Mafia Extended Mix</title>
<style>
  :root{
    --bg:#12141c; --panel:#1b1f2b; --panel2:#242a3a; --line:#313952; --text:#e8ebf4; --dim:#8b93ab;
    --mafia:#ff5d6c; --citizen:#5aa9ff; --neutral:#e6b84d; --accent:#7c6cff; --ok:#4cd08a;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:15px}
  body.night{background:#0b0d16}
  body.day{background:#1a1b22}
  button,input{font:inherit;color:inherit}
  button{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
  button.ghost{background:var(--panel2);color:var(--text)}
  button.danger{background:#b9374a}
  button:disabled{opacity:.4;cursor:not-allowed}
  input[type=text],input[type=number]{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
  input:focus{border-color:var(--accent)}
  [hidden]{display:none!important}
  .screen{max-width:560px;margin:0 auto}
  /* 홈 */
  #home{padding:28px 18px;display:flex;flex-direction:column;gap:14px}
  #home h1{margin:10px 0 0;font-size:30px;letter-spacing:1px}
  #home p{margin:0;color:var(--dim)}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}
  .row{display:flex;gap:8px;align-items:center}
  .grow{flex:1}
  /* 방 */
  #room{height:100dvh;display:flex;flex-direction:column}
  #top{padding:10px 14px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
  #top .title{font-weight:700;font-size:16px}
  #top .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:18px;color:var(--neutral)}
  #main{flex:1 1 auto;overflow:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:10px}
  .role-card{border-left:5px solid var(--line)}
  .role-card.mafia{border-left-color:var(--mafia)} .role-card.citizen{border-left-color:var(--citizen)} .role-card.neutral{border-left-color:var(--neutral)}
  .role-card .rname{font-weight:800;font-size:17px}
  .role-card .rteam{font-size:12px;margin-left:6px}
  .role-card .rdesc{color:var(--dim);font-size:13px;margin-top:4px;line-height:1.45}
  .hint{color:var(--dim);font-size:13.5px;line-height:1.45;padding:0 2px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
  .pcard{background:var(--panel2);border:2px solid transparent;border-radius:12px;padding:10px 8px;text-align:center;position:relative;min-height:62px;user-select:none}
  .pcard.click{cursor:pointer;border-color:var(--line)}
  .pcard.click:active{transform:scale(.97)}
  .pcard.sel{border-color:var(--accent);background:#2c2f55}
  .pcard.dead{opacity:.45}
  .pcard.me .pname::after{content:" (나)";color:var(--dim);font-weight:400;font-size:12px}
  .pcard.off .pname{color:var(--dim)}
  .pname{font-weight:700;word-break:break-all}
  .ptag{font-size:12px;margin-top:3px}
  .ptag.mafia{color:var(--mafia)} .ptag.citizen{color:var(--citizen)} .ptag.neutral{color:var(--neutral)}
  .badge{position:absolute;top:-6px;right:-4px;background:var(--accent);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 7px}
  .badge.t{background:var(--mafia);right:auto;left:-4px}
  .crown{position:absolute;top:2px;left:6px;font-size:12px}
  .kick{position:absolute;top:2px;right:4px;background:none;color:var(--dim);padding:2px 6px;font-size:14px}
  .banner{text-align:center;font-size:20px;font-weight:800;padding:14px}
  .banner.mafia{color:var(--mafia)} .banner.citizen{color:var(--citizen)}
  .banner.duo,.banner.solo,.banner.neutral,.banner.killers,.banner.draw{color:var(--neutral)}
  .rinfo{font-size:13px;margin-top:6px;color:var(--text)}
  .ability .albl{font-weight:700;margin-bottom:6px}
  .seg{display:flex;gap:8px;flex-wrap:wrap}
  .seg button{flex:1;min-width:110px}
  .actions{display:flex;gap:8px;flex-wrap:wrap}
  .actions button{flex:1;min-width:120px}
  /* 채팅 */
  #chatbox{flex:0 0 36%;min-height:190px;max-height:320px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column}
  #msgs{flex:1;overflow:auto;padding:8px 12px;font-size:14px;line-height:1.45}
  .m{margin:2px 0;word-break:break-word}
  .m b{margin-right:6px}
  .m.sys{color:var(--neutral)}
  .m.priv{color:var(--ok);font-weight:600}
  .m.mafia{color:var(--mafia)}
  .m.dead{color:var(--dim);font-style:italic}
  .m.couple{color:#ff8fd0}
  #chatlabel{font-size:12px;color:var(--dim);padding:2px 12px}
  #chatform{display:flex;gap:6px;padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
  #chatform button{padding:10px 14px}
  /* 설정 */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:10;display:flex;align-items:flex-end;justify-content:center}
  .sheet{background:var(--panel);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom))}
  .sheet h2{margin:0 0 4px;font-size:18px}
  .sheet h3{margin:16px 0 6px;font-size:14px;color:var(--dim)}
  .sheet .note{font-size:12.5px;color:var(--dim);line-height:1.5}
  .field{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0}
  .field input[type=number]{width:96px;text-align:right}
  .rrow{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);align-items:flex-start}
  .rrow input{margin-top:3px;width:18px;height:18px;flex:none}
  .rrow .rn{font-weight:700}
  .rrow .rd{font-size:12.5px;color:var(--dim);line-height:1.45;margin-top:2px}
  .rrow.off{opacity:.45}
  .rrow .cnts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:6px;font-size:12.5px;color:var(--dim)}
  .step{display:inline-flex;align-items:center;gap:4px}
  .step button{padding:2px 9px;min-width:30px;font-size:16px;line-height:1.2}
  .step b{display:inline-block;min-width:22px;text-align:center;color:var(--text,#fff);font-size:14px}
  .warnbox{background:#ffb4001a;border:1px solid #ffb40066;border-radius:10px;padding:8px 10px;margin:8px 0;font-size:12.5px;line-height:1.5}
  .rrow .forced{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--neutral);margin-top:5px}
  .rrow .forced input{margin:0;width:16px;height:16px}
  .soon{font-size:11px;background:var(--line);color:var(--dim);padding:1px 6px;border-radius:6px;margin-left:6px}
  .teamhead{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
  .teamhead span{font-weight:800}
  .teamhead button{padding:4px 10px;font-size:12px}
  .hbtn{background:var(--panel2);color:var(--text);padding:6px 10px;font-size:13px;border-radius:999px}
  .memo-btn{position:absolute;bottom:2px;right:3px;background:none;color:var(--dim);padding:2px 5px;font-size:14px;line-height:1}
  .ptag.memo{color:var(--dim);font-style:italic;border-top:1px dashed var(--line);padding-top:3px;margin-top:5px}
  .tabs{display:flex;gap:6px;margin:10px 0 4px}
  .tabs button{flex:1;padding:8px 6px;font-size:13.5px}
  .gp{font-size:13.5px;line-height:1.6}
  .gp p{margin:4px 0}
  .gp .k{font-weight:700}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
  .chips button{padding:7px 10px;font-size:13px;background:var(--panel2);color:var(--text);border:1px solid var(--line)}
  .chips button.on{color:#fff;border-color:transparent}
  .chips button.on.mafia{background:#b9374a} .chips button.on.citizen{background:#2f6fb8} .chips button.on.neutral{background:#a47d1c}
  .mine{font-size:11px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:6px;margin-left:6px}
  #toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000c;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:20;max-width:88vw;text-align:center}
</style>
</head>
<body>

<div id="home" class="screen">
  <h1>🎭 NME</h1>
  <p>New Mafia Extended Mix · 특수 직업이 가득한 마피아 게임</p>
  <div class="card">
    <div style="margin-bottom:6px;color:var(--dim);font-size:13px">내 이름 (최대 10자)</div>
    <input type="text" id="nameInput" maxlength="10" placeholder="이름을 입력하세요" autocomplete="off">
  </div>
  <button id="createBtn">방 만들기</button>
  <div class="card">
    <div style="margin-bottom:6px;color:var(--dim);font-size:13px">친구가 알려준 방 코드</div>
    <div class="row">
      <input type="text" id="codeInput" maxlength="4" placeholder="예: AB3K" autocomplete="off" style="text-transform:uppercase;letter-spacing:4px;font-weight:700">
      <button id="joinBtn" class="ghost" style="white-space:nowrap">입장</button>
    </div>
  </div>
</div>

<div id="room" class="screen" hidden>
  <header id="top"></header>
  <section id="main"></section>
  <section id="chatbox">
    <div id="msgs"></div>
    <div id="chatlabel"></div>
    <form id="chatform" autocomplete="off">
      <input type="text" id="chatinput" maxlength="200" placeholder="메시지 입력">
      <button type="submit" id="chatsend">전송</button>
    </form>
  </section>
</div>

<div id="modal" hidden>
  <div class="sheet" id="sheet"></div>
</div>
<div id="toast" hidden></div>

<script>
'use strict';
const $ = (s) => document.querySelector(s);
function h(tag, props, ...kids) {
  const e = document.createElement(tag);
  if (props) for (const [k, v] of Object.entries(props)) {
    if (k === 'class') e.className = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (v === true) e.setAttribute(k, '');
    else if (v !== false && v != null) e.setAttribute(k, v);
  }
  for (const c of kids.flat()) { if (c == null || c === false) continue; e.append(c.nodeType ? c : document.createTextNode(String(c))); }
  return e;
}

let meta = null, ROLE = {}, sess = null, st = null, es = null, offset = 0, settingsOpen = false;
const store = {
  get() { try { return JSON.parse(sessionStorage.getItem('dni-mafia') || 'null'); } catch (e) { return null; } },
  set(v) { try { sessionStorage.setItem('dni-mafia', JSON.stringify(v)); } catch (e) { /* */ } },
  clear() { try { sessionStorage.removeItem('dni-mafia'); } catch (e) { /* */ } },
};
const lsGet = (k) => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* */ } };

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.hidden = false;
  clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600);
}
async function api(path, body) {
  const r = await fetch(path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || '오류가 발생했어요.');
  return j;
}
function act(type, extra) {
  if (!sess) return Promise.resolve();
  return api('/api/action', Object.assign({ code: sess.code, token: sess.token, type }, extra)).catch((e) => toast(e.message));
}

/* ------------------------------------------------ 홈 */
function showHome() {
  $('#home').hidden = false; $('#room').hidden = true; closeSettings();
  document.body.className = '';
}
$('#nameInput').value = lsGet('dni-name');
{
  const c = new URLSearchParams(location.search).get('code');
  if (c) $('#codeInput').value = c.toUpperCase().slice(0, 4);
}
async function enter(path, body) {
  const name = $('#nameInput').value.trim();
  if (!name) { toast('이름을 먼저 입력해 주세요.'); return; }
  lsSet('dni-name', name);
  try {
    const r = await api(path, Object.assign({ name }, body));
    sess = { code: r.code, token: r.token, id: r.id };
    store.set(sess);
    connect();
  } catch (e) { toast(e.message); }
}
$('#createBtn').onclick = () => enter('/api/create', {});
$('#joinBtn').onclick = () => {
  const code = $('#codeInput').value.trim().toUpperCase();
  if (code.length !== 4) { toast('방 코드 4자리를 입력해 주세요.'); return; }
  enter('/api/join', { code });
};
$('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#joinBtn').click(); });
$('#nameInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') ($('#codeInput').value ? $('#joinBtn') : $('#createBtn')).click(); });

/* ------------------------------------------------ 연결 */
function connect() {
  if (es) es.close();
  $('#msgs').innerHTML = '';
  es = new EventSource(`/api/events?code=${sess.code}&token=${sess.token}`);
  es.addEventListener('state', (e) => { st = JSON.parse(e.data); offset = st.now - Date.now(); render(); });
  es.addEventListener('chat', (e) => addMsg(JSON.parse(e.data)));
  es.addEventListener('backlog', (e) => { $('#msgs').innerHTML = ''; JSON.parse(e.data).forEach(addMsg); });
  es.addEventListener('kicked', () => leaveLocal('방에서 나왔어요.'));
  es.onerror = () => {
    if (!sess) return;
    fetch(`/api/check?code=${sess.code}&token=${sess.token}`).then((r) => {
      if (r.status === 404) leaveLocal('방이 사라졌어요.');
    }).catch(() => { /* 네트워크 문제는 자동 재연결 */ });
  };
}
function leaveLocal(msg) {
  if (es) es.close();
  es = null; sess = null; st = null; store.clear();
  showHome(); if (msg) toast(msg);
}

/* ------------------------------------------------ 채팅 */
function addMsg(m) {
  const box = $('#msgs');
  const near = box.scrollHeight - box.scrollTop - box.clientHeight < 60;
  const row = h('div', { class: 'm ' + m.ch });
  if (m.name) row.append(h('b', null, m.name + (m.ch === 'mafia' ? ' 🔪' : m.ch === 'dead' ? ' 👻' : m.ch === 'couple' ? ' 💕' : '') + ':'));
  row.append(m.text);
  box.append(row);
  while (box.children.length > 250) box.firstChild.remove();
  if (near) box.scrollTop = box.scrollHeight;
}
// 채팅 가능 여부와 안내 문구는 서버가 정해서 보내 줍니다 (me.chat)
function chatInfo() {
  if (!st) return { can: false, label: '' };
  if (!st.me) return { can: true, label: '전체 대화' };
  return { can: !!st.me.chat.ch, label: st.me.chat.label };
}
$('#chatform').addEventListener('submit', (e) => {
  e.preventDefault();
  const inp = $('#chatinput'); const text = inp.value.trim();
  if (!text) return;
  inp.value = '';
  act('chat', { text });
});

/* ------------------------------------------------ 화면 그리기 */
const PHASE_TITLE = {
  lobby: () => '대기실',
  night: () => `🌙 ${st.day}일차 밤`,
  day: () => `☀️ ${st.day}일차 낮 · 토론`,
  vote: () => `🗳 ${st.day}일차 투표`,
  last: () => `💣 ${st.day}일차 · 테러리스트의 마지막 선택`,
  ended: () => '🏁 게임 종료',
};
const isHost = () => st && st.hostId === st.meId;
const teamName = (t) => meta.teams[t];
const pById = (id) => st.players.find((p) => p.id === id);

function render() {
  if (!st || !meta) return;
  $('#home').hidden = true; $('#room').hidden = false;
  document.body.className = st.phase === 'night' ? 'night' : (st.phase === 'day' || st.phase === 'vote' || st.phase === 'last') ? 'day' : '';
  if (st.phase === 'lobby') clearMemo();
  renderTop(); renderMain();
  const ci = chatInfo();
  $('#chatlabel').textContent = ci.label;
  $('#chatinput').disabled = !ci.can; $('#chatsend').disabled = !ci.can;
  $('#chatinput').placeholder = ci.can ? '메시지 입력' : '말할 수 없는 시간이에요';
  if (settingsOpen) syncSettings();
}

function begLeft() { return Math.max(0, Math.ceil((st.begAt - (Date.now() + offset)) / 1000)); }
function remaining() { return Math.max(0, Math.ceil((st.endsAt - (Date.now() + offset)) / 1000)); }
function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; }
setInterval(() => {
  const el = $('#timer');
  if (el && st && st.endsAt) el.textContent = fmt(remaining());
  const bc = $('#begcd');
  if (bc && st && st.begAt) bc.textContent = String(begLeft());
}, 250);

function renderTop() {
  const top = $('#top'); top.innerHTML = '';
  top.append(h('div', { class: 'title' }, PHASE_TITLE[st.phase]()));
  if (st.phase === 'lobby') top.append(h('div', { class: 'timer', style: 'letter-spacing:3px' }, st.code));
  else if (st.endsAt) top.append(h('div', { class: 'timer', id: 'timer' }, fmt(remaining())));
  top.append(h('button', { class: 'hbtn', onclick: openGuide }, '📖 설명서'));
}

let uiMode = 'vote', lastPhaseKey = '', progDraft = null;
function phaseKey() { return st.phase + ':' + st.day; }

let boomPick = null; // 처형된 테러리스트가 고른 사람 (확정 전)
function targetable(q) {
  const me = st.me;
  if (st.phase === 'last') return !!(me && me.boom && me.boom.targets.includes(q.id));
  if (!me || !me.alive) return false;
  if (st.phase === 'night') return !!(me.night && me.night.targets.includes(q.id));
  if (st.phase === 'vote') {
    if (uiMode === 'ability' && me.voteAbility) return me.voteAbility.targets.includes(q.id);
    return me.canVote && q.alive && (q.id !== st.meId || !!st.settings.selfVote);
  }
  return false;
}
function selectedId() {
  const me = st.me; if (!me) return null;
  if (st.phase === 'last') return boomPick;
  if (st.phase === 'night') return me.night ? me.night.pick : null;
  if (st.phase === 'vote') return (uiMode === 'ability' && me.voteAbility) ? me.voteAbility.pick : me.vote;
  return null;
}
function progText() { const el = $('#progtext'); return el ? el.value : undefined; }
function clickPlayer(q) {
  if (!targetable(q)) return;
  if (st.phase === 'last') { boomPick = boomPick === q.id ? null : q.id; render(); return; }
  const target = selectedId() === q.id ? null : q.id;
  if (st.phase === 'night') {
    const body = { target, mode: st.me.night.mode };
    if (st.me.night.text) body.text = progText();
    act('night', body);
  } else if (uiMode === 'ability') act('vact', { target });
  else act('vote', { target });
}

function hintText() {
  const me = st.me;
  if (st.phase === 'ended') return '';
  if (st.phase === 'last') return me.boom ? '💣 처형되었어요! 함께 죽을 사람을 골라 확정하세요. (고르지 않으면 아무도 죽지 않아요)' : '💣 처형된 테러리스트가 함께 죽을 사람을 고르는 중이에요…';
  if (!me.alive) return '💀 당신은 죽었습니다. 죽은 사람끼리 대화할 수 있어요. 게임은 계속 지켜볼 수 있어요.';
  if (st.phase === 'night') {
    const extra = me.chat && me.chat.ch ? ` ${me.chat.label} 가능 — 아래 채팅을 이용하세요.` : '';
    if (me.night) return (me.night.noTarget ? `${me.night.label} 아래 버튼으로 골라요.` : `${me.night.label}: 카드를 눌러 선택하세요. (다시 누르면 취소)`) + extra;
    if (me.info.some((l) => l.includes('유혹'))) return '💋 오늘 밤은 능력을 쓸 수 없어요.' + extra;
    return '🌙 밤입니다. 지금 쓸 수 있는 능력이 없어요. 아침을 기다려 주세요.' + extra;
  }
  if (st.phase === 'day') return '☀️ 토론 시간입니다. 누가 마피아일지 자유롭게 이야기해 보세요.';
  if (st.phase === 'vote') return me.canVote ? '🗳 처형할 사람을 선택하세요. 투표할 수 있는 모두가 투표하면 바로 개표해요. (다시 누르면 취소)' : '🚫 오늘은 투표할 수 없어요.';
  return '';
}

function playerCard(q, opts) {
  opts = opts || {};
  const me = st.me;
  const click = opts.clickable && targetable(q);
  const sel = opts.clickable && selectedId() === q.id;
  const cls = ['pcard'];
  if (click) cls.push('click');
  if (sel) cls.push('sel');
  if (!q.alive) cls.push('dead');
  if (q.id === st.meId) cls.push('me');
  if (!q.connected) cls.push('off');
  const card = h('div', { class: cls.join(' '), onclick: click ? () => clickPlayer(q) : null });
  if (q.host) card.append(h('span', { class: 'crown' }, '👑'));
  if (q.bot) card.append(h('span', { class: 'crown', style: 'left:auto;right:6px' }, '🤖'));
  card.append(h('div', { class: 'pname' }, q.name));
  if (q.role) card.append(h('div', { class: 'ptag ' + ROLE[q.role].team }, ROLE[q.role].name));
  if (!q.role && memoOn(q)) {
    const mm = getMemo()[q.id];
    if (mm && mm.length) card.append(h('div', { class: 'ptag memo' }, '📝 ' + mm.map((k) => ROLE[k] ? ROLE[k].name : k).join('/') + '?'));
    card.append(h('button', { class: 'memo-btn', title: '직업 메모', onclick: (e) => { e.stopPropagation(); openMemo(q.id); } }, '📝'));
  }
  if (!q.alive) card.append(h('div', { class: 'ptag' }, '💀 사망'));
  else if (!q.connected && st.phase !== 'lobby') card.append(h('div', { class: 'ptag' }, '연결 끊김'));
  if (st.phase === 'ended' && st.winner && st.winner.ids.includes(q.id)) card.append(h('div', { class: 'ptag', style: 'color:var(--ok)' }, '🏆 승리'));
  if (st.phase === 'vote' && st.tally && st.tally[q.id]) card.append(h('span', { class: 'badge' }, `🗳 ${st.tally[q.id]}`));
  if (st.phase === 'night' && me && me.mafiaPicks) {
    const n = Object.values(me.mafiaPicks).filter((t) => t === q.id).length;
    if (n) card.append(h('span', { class: 'badge t' }, `🎯 ${n}`));
  }
  if (opts.kick) card.append(h('button', { class: 'kick', title: '내보내기', onclick: (e) => { e.stopPropagation(); act('kick', { target: q.id }); } }, '✕'));
  return card;
}

  }
  main.append(acts);

function renderLobby(main) {
  const link = `${location.origin}/?code=${st.code}`;

    h('div', { class: 'hint' }, '친구에게 이 코드를 알려주세요'),

    h('div', { class: 'actions' },

  main.append(h('div', { class: 'hint' }, `참가자 ${st.players.length}/${st.maxPlayers}명 · 최소 ${st.minPlayers}명부터 시작할 수 있어요`));
  const grid = h('div', { class: 'grid' });
  for (const q of st.players) grid.append(playerCard(q, { kick: isHost() && q.id !== st.meId }));
  main.append(grid);
  const acts = h('div', { class: 'actions' });
  if (isHost()) {
    const enough = st.players.length >= st.minPlayers;
    acts.append(h('button', { class: 'ghost', onclick: () => act('addbot', { count: 1 }) }, '🤖 봇 추가'));
    acts.append(h('button', { class: 'ghost', onclick: () => act('addbot', { count: 5 }) }, '🤖 봇 5명 추가'));

  acts.append(h('button', { class: 'ghost', onclick: () => { act('leave'); leaveLocal(); } }, '나가기'));
  main.append(acts);
}
function copy(text) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(() => toast('링크를 복사했어요!'), () => prompt('링크를 복사하세요', text));
  else prompt('링크를 복사하세요', text);

/* ------------------------------------------------ 세부설정 */
const TEAM_COLOR = { mafia: 'var(--mafia)', citizen: 'var(--citizen)', neutral: 'var(--neutral)' };
function openSettings() { settingsOpen = true; buildSettings(); $('#modal').hidden = false; }
function closeSettings() { settingsOpen = false; $('#modal').hidden = true; }
const closeModal = closeSettings;

function numField(key, label, unit) {

function sendPatch(patch) { act('settings', { patch }); }
// 거지와 부자는 "거지 & 부자" 한 묶음: 한 번 고르면 둘이 같이 선택돼요

  sendPatch({ enabledRoles: withPair(on) });
}
function forcedPatch() {
  const on = [...document.querySelectorAll('#sheet input[data-forced]')].filter((c) => c.checked).map((c) => c.getAttribute('data-forced'));
  sendPatch({ forcedRoles: withPair(on) });

const isPairRich = (r) => r.key === 'rich';
function stepper(key, kind) {
  const cap = meta.caps[key] || 1;
  const val = h('b', { 'data-cnt': kind + ':' + key }, '0');
  const go = (d) => {
    if (!isHost()) return;
    const s = st.settings, cur = (kind === 'min' ? s.roleMin : s.roleMax)[key] | 0;
    const nv = Math.max(0, Math.min(cap, cur + d));
    if (nv !== cur) sendPatch({ [kind === 'min' ? 'roleMin' : 'roleMax']: { [key]: nv } });
  };
  return h('span', { class: 'step' }, kind === 'min' ? '최소' : '최대',
    h('button', { class: 'ghost', 'data-step': kind + ':' + key, onclick: () => go(-1) }, '−'), val,
    h('button', { class: 'ghost', 'data-step': kind + ':' + key, onclick: () => go(1) }, '+'));
}

    inp.disabled = !host;
  }
  const LVNOTE = { easy: '증거를 잘 따지지 못해 자주 틀려요. 가끔 행동을 빼먹고, 마피아도 실수로 팀원을 건드려요.', normal: '경찰 결과와 채팅을 참고해 의심하고, 마피아끼리 밤·투표를 맞춰요. 지목당하면 반박해요.',
    hard: '경찰이 둘 나오면 거짓말을 가려내고, 근거 없이 몰아가는 사람을 의심해요. 마피아는 가짜 경찰로 맞불을 놓아요.', extreme: '증거를 꼼꼼히 따져 표를 모으고, 진짜 경찰은 가짜 경찰을 지적해요. 마피아는 경찰·의사처럼 위협적인 사람을 노리고, 필요하면 동료를 희생해 의심을 피해요.' };
  for (const b of sheet.querySelectorAll('button[data-lv]')) b.className = b.getAttribute('data-lv') === s.botLevel ? '' : 'ghost';
  const note = sheet.querySelector('#lvnote'); if (note) note.textContent = (LVNOTE[s.botLevel] || '') + ' (봇은 남의 직업을 몰래 보지 않아요)';
  for (const cb of sheet.querySelectorAll('input[data-role]')) {
    const r = ROLE[cb.getAttribute('data-role')];
    cb.checked = s.enabledRoles.includes(r.key);
    cb.disabled = !(r.impl && host);
  }
  for (const el of sheet.querySelectorAll('[data-cnt]')) {
    const [kind, key] = el.getAttribute('data-cnt').split(':');
    el.textContent = String((kind === 'min' ? s.roleMin : s.roleMax)[key] | 0);
  }
  for (const b of sheet.querySelectorAll('button[data-step]')) b.disabled = !host || !s.enabledRoles.includes(b.getAttribute('data-step').split(':')[1]);
  for (const row of sheet.querySelectorAll('.rrow')) {
    const c = row.querySelector('input[data-role]');
    if (c) row.classList.toggle('off', !c.checked);
  }
  const warns = sheet.querySelector('#warns');
  if (warns) {
    warns.innerHTML = '';
    const en = s.enabledRoles;
    const hasMafiaTeam = ['spy', 'madam', 'assassin', 'ghost', 'informant', 'doppelganger'].some((k) => en.includes(k));
    if (!en.includes('mafia') || s.roleMax.mafia === 0) warns.append(h('div', { class: 'warnbox' }, hasMafiaTeam
      ? '⚠ 일반 마피아가 꺼져 있어요. 마피아 팀이 보조 직업만으로 구성돼서 직접 공격할 사람이 없을 수 있어요. 이 경우 게임이 길어지거나 무승부가 될 수 있어요.'
      : '⚠ 마피아 팀으로 쓸 직업이 하나도 없어요. 그대로 시작하면 일반 마피아가 자동으로 들어가요.'));
    if (!en.includes('citizen') || s.roleMax.citizen === 0) warns.append(h('div', { class: 'warnbox' }, '⚠ 일반 시민이 꺼져 있어요. 시민 팀은 특수 직업으로만 채워지고, 직업이 모자라면 일반 시민이 대신 들어가요.'));
  }
  for (const fc of sheet.querySelectorAll('input[data-forced]')) {
    const r = ROLE[fc.getAttribute('data-forced')];
    fc.checked = (s.forcedRoles || []).includes(r.key);
    fc.disabled = !(r.impl && host);
  }
}


/* ------------------------------------------------ 메모 (내 기기에만 저장, 다른 사람은 못 봐요) */
let memoCache = null;
function getMemo() {
  if (!st) return {};
  if (!memoCache || memoCache.code !== st.code) {
    let v = null; try { v = JSON.parse(sessionStorage.getItem('nme-memo') || 'null'); } catch (e) { /* */ }
    memoCache = (v && v.code === st.code) ? v : { code: st.code, m: {} };
  }
  return memoCache.m;
}
function saveMemo() { try { sessionStorage.setItem('nme-memo', JSON.stringify(memoCache)); } catch (e) { /* */ } }
function clearMemo() { if (memoCache && Object.keys(memoCache.m).length) { memoCache.m = {}; saveMemo(); } else if (!memoCache) { try { sessionStorage.removeItem('nme-memo'); } catch (e) { /* */ } } }
function memoOn(q) { return st.phase !== 'lobby' && st.phase !== 'ended' && q.id !== st.meId; }
function memoRoles() { // 이번 판에 나올 수 있는 직업만
  const on = st.settings.enabledRoles || [];
  return meta.roles.filter((r) => r.impl && (r.key === 'mafia' || r.key === 'citizen' || on.includes(r.key))); // 광대로 누구나 마피아·시민이 될 수 있어서 항상 포함
}
function openMemo(pid) {
  const q = pById(pid); if (!q) return;
  const sheet = $('#sheet'); sheet.innerHTML = '';
  const cur = getMemo()[pid] || [];
  sheet.append(
    h('div', { class: 'row' }, h('h2', { class: 'grow' }, `📝 ${q.name}님은 무슨 직업일까?`), h('button', { class: 'ghost', onclick: closeModal }, '닫기')),
    h('div', { class: 'note' }, '추리용 메모예요. 나만 볼 수 있고 게임 결과에는 영향이 없어요. 최대 3개까지 고를 수 있어요. (눌러서 켜고 끄기)'));
  for (const team of ['mafia', 'citizen', 'neutral']) {
    const rs = memoRoles().filter((r) => r.team === team);
    if (!rs.length) continue;
    sheet.append(h('h3', { style: 'color:' + TEAM_COLOR[team] }, meta.teams[team]),
      h('div', { class: 'chips' }, rs.map((r) => h('button', { class: (cur.includes(r.key) ? 'on ' : '') + team, onclick: () => {
        const m = getMemo(); let a = (m[pid] || []).slice();
        if (a.includes(r.key)) a = a.filter((k) => k !== r.key);
        else { if (a.length >= 3) { toast('최대 3개까지 고를 수 있어요.'); return; } a.push(r.key); }
        if (a.length) m[pid] = a; else delete m[pid];
        saveMemo(); openMemo(pid); render();
      } }, r.name))));
  }
  sheet.append(h('div', { class: 'actions', style: 'margin-top:14px' },
    h('button', { class: 'ghost', onclick: () => { delete getMemo()[pid]; saveMemo(); openMemo(pid); render(); } }, '이 사람 메모 지우기'),
    h('button', { class: 'ghost', onclick: () => { memoCache.m = {}; saveMemo(); closeModal(); render(); } }, '전체 메모 지우기')));
  settingsOpen = false; $('#modal').hidden = false;
}

/* ------------------------------------------------ 설명서 */
let guideTab = 'rules';
function openGuide() { buildGuide(); settingsOpen = false; $('#modal').hidden = false; }
function buildGuide() {
  const sheet = $('#sheet'); sheet.innerHTML = '';
  const tab = (k, l) => h('button', { class: guideTab === k ? '' : 'ghost', onclick: () => { guideTab = k; buildGuide(); } }, l);
  sheet.append(
    h('div', { class: 'row' }, h('h2', { class: 'grow' }, '📖 설명서'), h('button', { class: 'ghost', onclick: closeModal }, '닫기')),
    h('div', { class: 'tabs' }, tab('rules', '진행·규칙'), tab('roles', '직업 도감'), tab('tips', '메모·팁')));
  const P = (...c) => h('p', null, ...c);
  const K = (t) => h('span', { class: 'k' }, t);
  if (guideTab === 'rules') {
    sheet.append(h('div', { class: 'gp' },
      h('h3', null, '🔁 게임 진행'),
      P('1일차 ', K('밤'), '부터 시작해요. 밤 → 아침(토론) → 투표 → 밤 … 순서로 돌아가요.'),
      P(K('밤'), ': 능력이 있는 직업은 카드를 눌러 대상을 골라요. 마피아는 팀끼리 한 명을 정해 죽여요.'),
      P(K('아침'), ': 밤에 일어난 일이 알려지고 자유롭게 토론해요.'),
      P(K('투표'), ': 처형할 사람을 골라요. 최다 득표자가 ', K('한 명일 때만'), ' 처형되고, 동률이면 아무도 처형되지 않아요. 기권도 가능해요. 방 설정에 따라 자기 자신에게도 투표할 수 있어요. 투표할 수 있는 모두가 투표하면 바로 개표해요.'),
      P(K('테러리스트'), '가 투표로 처형되면 잠깐(15초) 동안 함께 죽을 사람을 고를 수 있어요.'),
      P(K('아침 시간 조절'), ': 살아 있는 사람은 아침마다 한 번, "10초 줄이기"와 "10초 늘리기" 중 하나를 쓸 수 있어요. 쓰면 모두에게 알려져요.'),
      h('h3', null, '🏆 승리 조건'),
      P(K('시민 팀'), ': 마피아 팀과 중립 팀이 모두 사라지면 승리.'),
      P(K('마피아 팀'), ': 시민 팀 + 중립 팀 인원이 마피아 팀 인원과 같거나 적어지면 승리.'),
      P(K('중립 팀'), ': 기본은 자신을 제외한 모두가 사라지면 승리. 직업마다 따로 정해진 방식이 있으면 그걸 따라요. (거지·부자, 혁명가, 광대 등은 도감 참고)'),
      h('h3', null, '💬 채팅'),
      P(K('낮'), '에는 모두가 함께 얘기해요. ', K('밤'), '에는 접선한 마피아 팀끼리, 커플끼리 대화할 수 있어요. 죽은 사람들은 따로 대화하고, 영매는 죽은 사람과 이야기할 수 있어요.'),
      h('h3', null, '🔒 비밀 지키기'),
      P('내 직업과 능력 결과는 나에게만 보여요. 다른 사람의 직업은 능력으로 알아내기 전까지 몰라요. (방 설정에서 "죽으면 직업 공개"를 켠 경우에만 죽은 사람의 직업이 공개돼요. 기본은 비공개예요.)')));
  } else if (guideTab === 'roles') {
    const on = st.settings.enabledRoles || [];
    sheet.append(h('div', { class: 'note' }, '이번 방에서 쓰도록 체크된 직업만 나올 수 있어요. 인원이 적으면 전부 나오지는 않아요. 체크 해제된 직업은 흐리게 표시돼요.'));
    for (const team of ['mafia', 'citizen', 'neutral']) {
      sheet.append(h('div', { class: 'teamhead' }, h('span', { style: 'color:' + TEAM_COLOR[team] }, meta.teams[team])));
      for (const r of meta.roles.filter((x) => x.team === team && x.impl && !isPairRich(x))) {
        const included = on.includes(r.key);
        const mine = st.me && (st.me.role === r.key || (r.key === 'beggar' && st.me.role === 'rich'));
        sheet.append(h('div', { class: 'rrow' + (included ? '' : ' off') },
          h('div', null,
            h('div', { class: 'rn' }, roleTitle(r), mine ? h('span', { class: 'mine' }, '내 직업') : null, included ? null : h('span', { class: 'soon' }, '이번 판 제외')),
            ...roleDescEls(r, 'rd'))));
      }
    }
  } else {
    sheet.append(h('div', { class: 'gp' },
      h('h3', null, '📝 직업 메모 쓰는 법'),
      P('게임 중 다른 사람 카드 오른쪽 아래의 ', K('📝'), ' 버튼을 누르면 "이 사람은 무슨 직업일까?"를 적어 둘 수 있어요. 최대 3개까지 고를 수 있고, 카드에 ', K('📝 경찰/의사?'), '처럼 표시돼요.'),
      P('메모는 ', K('내 화면에만'), ' 저장되고 다른 사람은 볼 수 없어요. 새 게임을 시작하면 지워져요.'),
      P('직업이 공개된 사람(죽어서 공개)은 메모 대신 진짜 직업이 보여요.'),
      h('h3', null, '🔍 추리 팁'),
      P('· 누가 "나 경찰이야"라고 주장하면 그 말이 진짜인지 다른 주장과 비교해 보세요. 경찰을 사칭하는 마피아도 있어요.'),
      P('· 밤새 아무도 안 죽었다면 의사의 치료, 경호원의 방어 같은 일이 있었는지 생각해 보세요.'),
      P('· 투표에서 누가 누구를 찍는지 눈여겨보세요. 마피아는 동료를 감싸거나 일부러 외면하기도 해요.'),
      P('· 능력이 없는 시민도 토론과 투표로 이길 수 있어요. 메모로 의심 가는 사람을 정리해 두면 편해요.')));
  }
}

/* ------------------------------------------------ 서버가 잠들지 않게 */
setInterval(() => { if (sess) fetch('/healthz').catch(() => {}); }, 5 * 60 * 1000);

/* ------------------------------------------------ 시작 */
(async function init() {
  try {
    meta = await (await fetch('/api/meta')).json();
    for (const r of meta.roles) ROLE[r.key] = r;
  } catch (e) { toast('서버에 연결할 수 없어요.'); return; }
  const saved = store.get();
  if (saved) {
    try {
      const r = await fetch(`/api/check?code=${saved.code}&token=${saved.token}`);
      if (r.ok) { sess = saved; connect(); return; }
    } catch (e) { /* */ }
    store.clear();
  }
  showHome();
})();
</script>
